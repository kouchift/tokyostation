function paint(){
  document.getElementById("c-ok").textContent = ok;
  document.getElementById("c-ng").textContent = ng;
  document.getElementById("c-wt").textContent = wt;
  document.getElementById("bar").style.width = ((ok+ng)/FILES.length*100).toFixed(1)+"%";
  if (missing.length){
    document.getElementById("miss").classList.remove("hide");
    document.getElementById("misslist").value = missing.join("\n");

FILES.forEach(function(f, i){
  var tr = document.createElement("tr");
  tr.innerHTML = '<td>'+f.p+'</td><td>'+fmt(f.s)+'</td><td class="st">…</td>';
  rows.appendChild(tr);
  fetch(f.p, {method:"HEAD", cache:"no-store"}).then(function(r){
    wt--;
    if (r.ok){ ok++; tr.className="ok"; tr.lastChild.textContent="○"; }
