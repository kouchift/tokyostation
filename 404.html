<!DOCTYPE html>

<!-- GitHub Pages は存在しない URL にこのファイルを «404 のステータスで» 返す。どの階層の URL でも出るので、リンクはすべて /tokyostation/ から始まる絶対パスで書く -->
<link rel="icon" href="/tokyostation/favicon.ico" sizes="48x48">

<style>
:root{--ink:#1a2733;--sub:#5b6773;--line:#e1e6ec;--blue:#0B5394;--bg:#f7f9fc}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg);line-height:1.7}
header{background:#00224A}header a{display:block;max-width:720px;margin:0 auto;padding:10px 16px;color:#fff;font-weight:800;text-decoration:none}
main{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 8px}h2{font-size:16px;margin:28px 0 8px}
p{margin:0 0 12px}
form{display:flex;gap:8px;margin:8px 0 4px}
input{flex:1;min-width:0;font-size:16px;padding:10px 12px;border:2px solid var(--blue);border-radius:10px}
button,.btn{font:inherit;font-weight:800;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:10px 18px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-block}
ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
li a{display:block;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);text-decoration:none;font-weight:700}
small{color:var(--sub)}
</style>
</head>
<body>
<header><a href="/tokyostation/">🚉 東京ステーションガイド</a></header>
<main>

<p><a class="btn" href="/tokyostation/">トップ（路線図と行き方の比較）へ戻る</a></p>

<h2>駅名から探す</h2>
<form action="/tokyostation/" method="get" role="search">
  <input name="st" type="search" placeholder="例：渋谷、上野、品川" aria-label="駅名" enterkeyhint="search" required>
  <button type="submit">開く</button>
</form>
<p><small>駅名が見つからないときは、トップの検索窓から探せます。</small></p>
