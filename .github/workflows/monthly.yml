# 毎月 1 日に «主要駅の出入口» と «はじめての土地の 6 ジャンル» を OpenStreetMap から作り直す（v114）
#   → data/auto/station_exits.js ・ data/auto/travel.js
# 手で動かす: GitHub の Actions タブ → monthly-osm → Run workflow
name: monthly-osm
on:
  schedule:
    - cron: "0 18 1 * *"          # 毎月 1 日 18:00 UTC = 2 日 3:00 JST
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: { group: auto-data, cancel-in-progress: false }
jobs:
  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 主要駅の出入口
        run: rm -f tools/station_exits_cache.json && python tools/build_station_exits.py
      - name: はじめての土地の 6 ジャンル
        run: python tools/build_travel_poi.py
      - name: 変わっていれば記録して公開
        run: |
          git config user.name "tsg-bot"
          git config user.email "tsg-bot@users.noreply.github.com"
          git add data/auto
          if git diff --cached --quiet; then echo "変化なし"; exit 0; fi
          git commit -m "自動更新: 出入口と 6 ジャンル $(TZ=Asia/Tokyo date +%F)"
          git pull --rebase origin ${{ github.ref_name }} && git push
          curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
