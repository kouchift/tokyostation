# 毎朝 5 時（日本時間）に «話題の場所» を自動更新する → data/auto/buzz_auto.js（v114）
# 手で動かす: GitHub の Actions タブ → daily-buzz → Run workflow
name: daily-buzz
on:
  schedule:
    - cron: "17 */3 * * *"          # 20:00 UTC = 翌 5:00 JST
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: { group: auto-data, cancel-in-progress: false }
jobs:
  buzz:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # fetch-depth: 0 — sitemap の lastmod を «各ファイルの最終コミット日» で出すため全履歴が要る
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: python tools/auto_buzz.py
      # sitemap.xml を毎回作り直す（lastmod が 2026-09-23 で止まった再発防止。中身が変わらなければコミットされない）
      - name: sitemap を再生成
        run: node tools/build_sitemap.js
      - name: 変わっていれば記録して公開
        run: |
          git config user.name "tsg-bot"
          git config user.email "tsg-bot@users.noreply.github.com"
          git add data/auto sitemap.xml
          if git diff --cached --quiet; then echo "変化なし"; exit 0; fi
          git commit -m "自動更新: 話題の場所 $(TZ=Asia/Tokyo date +%F)"
          git pull --rebase origin ${{ github.ref_name }} && git push
          curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
