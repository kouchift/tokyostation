/* 最初の1枚：CSS が届く前でも «真っ白» にしない骨組み */
.mapwrap{min-height:52vh;background:#F5F6F8}
.skel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#5A6472;font-size:13px;pointer-events:none;transition:opacity .3s}
.skel i{width:34px;height:34px;border-radius:50%;border:3px solid #C0E4FF;border-top-color:#0055AD;animation:sk 1s linear infinite}
@keyframes sk{to{transform:rotate(360deg)}}
.skel.off{opacity:0}
@media (prefers-reduced-motion:reduce){.skel i{animation:none}}
</style>

<body>

<!-- ▼ 本体：assets/*.js を tools/build_bundle.js で1本にまとめたもの（直すときは元ファイルを） -->
<script>
/* v86: Material Symbols が届いたらアイコンを見せる（届く前は ligature の文字が見えないように隠している）。v87: 字体は同梱なので通常 0.1 秒以内。4 秒待っても届かなければ出す */
(function(){var h=document.documentElement,done=false;function ok(){if(done)return;done=true;h.classList.add("fonts-ok");}
try{if(document.fonts&&document.fonts.load){document.fonts.load('20px "Material Symbols Outlined"').then(ok,ok);}}catch(e){}
setTimeout(ok,4000);})();
</script>
<script src="assets/app.bundle.js?v=88" defer></script>
<script>
/* 起動。
   ・data/net.json（駅・路線）は bundle と並列で取りに行く
   ・bundle が届いたら RG.startApp に渡す。両方そろった瞬間に地図を描く
   ・部品が読めていなければ、必ず気づけるようにする */
(function () {
  var netP = fetch("data/net.json?v=88", { credentials: "same-origin" })
    .then(function (r) { if (!r.ok) throw new Error("net.json " + r.status); return r.json(); })
    .catch(function (e) { console.error(e); return null; });
  function panic(msg) {
    if (document.querySelectorAll("#map .node").length) return;
    var m = document.getElementById("boot-error");
    if (m) { m.hidden = false; var p = m.querySelector("p"); if (p) p.textContent = msg; }
    var sk = document.getElementById("skel"); if (sk) sk.remove();
  }
  function go() {
    if (!window.RG || typeof window.RG.startApp !== "function") {
      panic("プログラムの部品（assets/app.bundle.js）を読み込めませんでした。"); return;
    }
    try { window.RG.startApp(netP); }
    catch (e) { panic("起動でつまずきました：" + (e && e.message ? e.message : e)); }
    setTimeout(function () {
      if (document.querySelectorAll("#map .node").length) return;
      panic("読み込みが終わりませんでした。通信状態をご確認のうえ、再読み込みしてください。");
    }, 30000);
  }
  var sc = document.querySelector('script[src="assets/app.bundle.js?v=88"]');
  if (window.RG && window.RG.startApp) go();
  else if (sc) { sc.addEventListener("load", go); sc.addEventListener("error", function () { panic("プログラムの部品（assets/app.bundle.js）を読み込めませんでした。"); }); }
  // 地図の最初の駅が出たら骨組みを消す
  var mo = new MutationObserver(function () {
    if (document.querySelector("#map .node")) { var sk = document.getElementById("skel"); if (sk) { sk.classList.add("off"); setTimeout(function () { sk.remove(); }, 400); } mo.disconnect(); }
  });
  mo.observe(document.getElementById("map"), { childList: true, subtree: true });
})();
</script>
<script>
/* 2回目からの表示を速くするしくみ。地図が出て、端末が暇になってから登録する */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", function () {
    setTimeout(function () { navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(function () { }); }, 4000);
  });
}
</script>
