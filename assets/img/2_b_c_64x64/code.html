<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgIcon64v3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f9ff"/>
      <stop offset="100%" stop-color="#edf3fa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" fill="url(#bgIcon64v3)"/>

  <!-- ========================================================
       C) 極小アイコン (64x64) 忠実シルエット＆細身チャコールグレー版
       要件:
       - 太すぎる黒線を排除 -> 細く濃いめのグレー (#334155 / #2b3642)
       - 日本列島の形をより忠実に再現 (北海道の菱形＋渡島半島、本州の能登半島・房総・紀伊半島・中国地方のくびれ、四国、九州・薩摩大隅)
       - トンボ（レジスターマーク）との調和
       - 2色以内のルール・世界観保持
       - 3箇所の灯火ピンビーコン (#0061a1)
       ======================================================== -->

  <!-- トンボ（レジスターマーク）: #0061a1, opacity 0.45 -->
  <g stroke="#0061a1" stroke-width="0.8" opacity="0.45" stroke-linecap="square">
    <!-- 四隅トンボ -->
    <line x1="3" y1="6" x2="8" y2="6"/>
    <line x1="6" y1="3" x2="6" y2="8"/>
    <line x1="56" y1="6" x2="61" y2="6"/>
    <line x1="58" y1="3" x2="58" y2="8"/>
    <line x1="3" y1="58" x2="8" y2="58"/>
    <line x1="6" y1="56" x2="6" y2="61"/>
    <line x1="56" y1="58" x2="61" y2="58"/>
    <line x1="58" y1="56" x2="58" y2="61"/>

    <!-- センタートンボ -->
    <line x1="32" y1="2" x2="32" y2="5"/>
    <line x1="32" y1="59" x2="32" y2="62"/>
    <line x1="2" y1="32" x2="5" y2="32"/>
    <line x1="59" y1="32" x2="62" y2="32"/>
  </g>

  <!-- 日本列島シルエット (細めの濃いグレー線 #2f3844, 塗り #dbe7f5)
       ストローク幅: 1.0px（以前の1.8px太黒線から大幅に繊細化）
       本物の日本地図に忠実な幾何学ベクターパス -->
  <g fill="#dce8f6" stroke="#2c3540" stroke-width="0.95" stroke-linejoin="round" stroke-linecap="round">
    
    <!-- 1. 北海道 (知床・根室・襟裳岬・渡島半島・石狩湾のリアルな特徴) -->
    <path d="M43,6.5
             C45,6 48,8 51,8.5
             C53.5,9 56,10 56,11.5
             C54.5,12.5 51,13 49,15.5
             C47,18 43,18 40.5,18
             C39,17.5 38.5,15.5 37,15
             C36,14.5 38,13 39.5,12
             C39.5,10 40.5,7 43,6.5 Z"/>

    <!-- 2. 本州 (下北・津軽半島、三陸海岸、房総半島、能登半島の突出、若狭湾、紀伊半島、中国地方・下関) -->
    <path d="M40.5,19.5
             C41.5,21 42,23 41.5,25.5
             C41,28 39.5,31 38,33
             C39,34.5 39,36 37.5,37
             C36,38 34,37.5 33,38
             C31,39 30,41.5 28,42
             C24,43 20,44.5 16,46.5
             C12.5,48 10,49 8,50
             C7.5,49 8.5,48 10,47
             C13,45 18,43 22,41
             C25,39.5 27,38 28.5,35.5
             C29.5,34 29,32.5 31,30.5
             C32.5,29 33.5,29.5 33,28
             C32,25.5 34.5,24 36.5,22
             C38.5,20 39.5,18.5 40.5,19.5 Z"/>

    <!-- 3. 四国 (鳴門・高知・足摺岬・佐田岬の紡錘形) -->
    <path d="M22,44.5
             C24.5,43.5 27,44 28,45.5
             C28.5,47 27,48.5 25,49.5
             C23,50.5 19.5,50 18,48.5
             C17.5,47 19.5,45.5 22,44.5 Z"/>

    <!-- 4. 九州 (国東・有明海・天草・薩摩大隅半島・桜島・南端鹿児島) -->
    <path d="M12.5,48
             C14.5,47 16,48.5 15.5,51
             C15,53.5 16,55.5 15,58
             C14,59.5 11,59 9.5,57.5
             C8,56 8.5,54.5 7,53
             C6.5,51 9.5,50 11,49 Z"/>

  </g>

  <!-- 名店接続ルート（極細点線） -->
  <path d="M46.5,12.5 Q38,24 35.5,34.5 Q24,43 11.5,53.5" 
        fill="none" stroke="#007ac9" stroke-width="0.8" stroke-dasharray="1.5,2" stroke-opacity="0.45"/>

  <!-- 3箇所の灯火ピンビーコン (#0061a1) -->
  <!-- 札幌（北海道） -->
  <circle cx="46.5" cy="12.5" r="2.0" fill="#0061a1"/>

  <!-- 東京（本州キーステーション：二重ドット） -->
  <circle cx="36" cy="35" r="2.8" fill="#0061a1"/>
  <circle cx="36" cy="35" r="1.1" fill="#ffffff"/>

  <!-- 福岡・九州 -->
  <circle cx="11.5" cy="53.5" r="2.0" fill="#0061a1"/>

</svg>
