<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Base subtle gradient across banner (#f7f9ff to #edf3fa) -->
    <linearGradient id="bgBanner400" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f9ff"/>
      <stop offset="60%" stop-color="#f1f5fb"/>
      <stop offset="100%" stop-color="#e6eff8"/>
    </linearGradient>

    <!-- Linear directional fade overlay for tombo depth -->
    <linearGradient id="tomboGradFade400" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0061a1" stop-opacity="0.06"/>
      <stop offset="20%" stop-color="#0061a1" stop-opacity="0.02"/>
      <stop offset="50%" stop-color="#f7f9ff" stop-opacity="0"/>
      <stop offset="80%" stop-color="#006c4b" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#006c4b" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- Background fills -->
  <rect width="1200" height="400" fill="url(#bgBanner400)"/>
  <rect width="1200" height="400" fill="url(#tomboGradFade400)"/>

  <!-- ========================================================
       トンボ（レジスターマーク・二重コーナートンボ・センタートンボ）
       案2-B改改準拠: しっかり視認できる濃度（不透明度0.40〜0.45）
       ======================================================== -->
  <g stroke="#0061a1" stroke-width="1.3" stroke-linecap="square">
    
    <!-- 1. 左上コーナートンボ (Top-Left Double Corner Tombo) -->
    <g opacity="0.45">
      <line x1="10" y1="28" x2="44" y2="28"/>
      <line x1="28" y1="10" x2="28" y2="44"/>
      <line x1="10" y1="20" x2="44" y2="20" stroke-dasharray="1.5,2.5"/>
      <line x1="20" y1="10" x2="20" y2="44" stroke-dasharray="1.5,2.5"/>
      <circle cx="28" cy="28" r="5" fill="none" stroke-width="0.9"/>
    </g>

    <!-- 2. 右上コーナートンボ (Top-Right Double Corner Tombo) -->
    <g opacity="0.45">
      <line x1="1156" y1="28" x2="1190" y2="28"/>
      <line x1="1172" y1="10" x2="1172" y2="44"/>
      <line x1="1156" y1="20" x2="1190" y2="20" stroke-dasharray="1.5,2.5"/>
      <line x1="1180" y1="10" x2="1180" y2="44" stroke-dasharray="1.5,2.5"/>
      <circle cx="1172" cy="28" r="5" fill="none" stroke-width="0.9"/>
    </g>

    <!-- 3. 左下コーナートンボ (Bottom-Left Double Corner Tombo) -->
    <g opacity="0.45">
      <line x1="10" y1="372" x2="44" y2="372"/>
      <line x1="28" y1="356" x2="28" y2="390"/>
      <line x1="10" y1="380" x2="44" y2="380" stroke-dasharray="1.5,2.5"/>
      <line x1="20" y1="356" x2="20" y2="390" stroke-dasharray="1.5,2.5"/>
      <circle cx="28" cy="372" r="5" fill="none" stroke-width="0.9"/>
    </g>

    <!-- 4. 右下コーナートンボ (Bottom-Right Double Corner Tombo) -->
    <g opacity="0.45">
      <line x1="1156" y1="372" x2="1190" y2="372"/>
      <line x1="1172" y1="356" x2="1172" y2="390"/>
      <line x1="1156" y1="380" x2="1190" y2="380" stroke-dasharray="1.5,2.5"/>
      <line x1="1180" y1="356" x2="1180" y2="390" stroke-dasharray="1.5,2.5"/>
      <circle cx="1172" cy="372" r="5" fill="none" stroke-width="0.9"/>
    </g>

    <!-- 5. センタートンボ (Top, Bottom, Left, Right Center Marks) -->
    <g opacity="0.42">
      <!-- 上中央 センタートンボ -->
      <line x1="600" y1="6" x2="600" y2="36"/>
      <line x1="585" y1="21" x2="615" y2="21"/>
      <circle cx="600" cy="21" r="5" fill="none" stroke-width="0.9"/>
      
      <!-- 下中央 センタートンボ -->
      <line x1="600" y1="364" x2="600" y2="394"/>
      <line x1="585" y1="379" x2="615" y2="379"/>
      <circle cx="600" cy="379" r="5" fill="none" stroke-width="0.9"/>

      <!-- 左中央 センタートンボ -->
      <line x1="6" y1="200" x2="36" y2="200"/>
      <line x1="21" y1="185" x2="21" y2="215"/>
      <circle cx="21" cy="200" r="5" fill="none" stroke-width="0.9"/>

      <!-- 右中央 センタートンボ -->
      <line x1="1164" y1="200" x2="1194" y2="200"/>
      <line x1="1179" y1="185" x2="1179" y2="215"/>
      <circle cx="1179" cy="200" r="5" fill="none" stroke-width="0.9"/>
    </g>

    <!-- 6. トンボに連動する繊細な版下アタリ基準線 -->
    <g opacity="0.25">
      <!-- 水平ガイド線 (左右から中央テキストエリア手前まで) -->
      <line x1="50" y1="200" x2="280" y2="200" stroke-dasharray="2,6"/>
      <line x1="920" y1="200" x2="1150" y2="200" stroke-dasharray="2,6"/>
      
      <!-- 日本列島エリアの垂直基準線 -->
      <line x1="175" y1="24" x2="175" y2="376" stroke-dasharray="2,6" stroke-width="1"/>
    </g>
  </g>

  <!-- ========================================================
       日本列島（1200×400pxに対して、北海道上端が上部トンボ寄り、鹿児島最南端が下部トンボ寄りにダイナミック配置）
       中心基準：x=175, y=200, scale=1.5
       ======================================================== -->
  <g transform="translate(175, 200) scale(1.5)">
    
    <!-- 北海道 (Hokkaido: y ≒ -110*1.5 = -165 -> キャンバスy ≒ 35px) -->
    <path d="M48,-110 
             C58,-116 76,-107 88,-104 
             C94,-98 102,-94 98,-86 
             C94,-80 78,-80 70,-72 
             C66,-66 54,-68 46,-76 
             C42,-80 38,-98 48,-110 Z" 
          fill="#e2ecf8" stroke="#0061a1" stroke-width="2" stroke-linejoin="round"/>

    <!-- 本州 (Honshu: 優美な弧と正確なプロポーション) -->
    <path d="M52,-62 
             C56,-44 50,-22 42,-4 
             C36,10 30,24 14,32 
             C2,38 -16,44 -38,50 
             C-58,56 -78,62 -94,68 
             C-98,63 -88,56 -74,50 
             C-50,40 -26,28 -10,20 
             C2,14 14,2 22,-12 
             C30,-26 38,-46 42,-62 
             C46,-66 49,-65 52,-62 Z" 
          fill="#e2ecf8" stroke="#0061a1" stroke-width="2" stroke-linejoin="round"/>

    <!-- 四国 (Shikoku) -->
    <path d="M-36,62 
             C-24,58 -14,61 -12,68 
             C-11,74 -22,80 -34,81 
             C-44,80 -46,71 -36,62 Z" 
          fill="#e2ecf8" stroke="#0061a1" stroke-width="2" stroke-linejoin="round"/>

    <!-- 九州・鹿児島 (Kyushu: y ≒ 110*1.5 = 165 -> キャンバスy ≒ 365px) -->
    <path d="M-88,74 
             C-78,69 -70,72 -68,80 
             C-66,90 -71,104 -80,110 
             C-88,112 -98,104 -100,94 
             C-102,84 -94,77 -88,74 Z" 
          fill="#e2ecf8" stroke="#0061a1" stroke-width="2" stroke-linejoin="round"/>

    <!-- 航路・名店接続ルート（点線） -->
    <path d="M68,-86 Q38,-28 24,14 Q-28,54 -80,88" 
          fill="none" stroke="#007ac9" stroke-width="1.5" stroke-dasharray="3,4" stroke-opacity="0.5"/>

    <!-- 灯火ピン：札幌 -->
    <g transform="translate(68, -86)">
      <circle cx="0" cy="0" r="8" fill="none" stroke="#006c4b" stroke-opacity="0.3" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="4" fill="#006c4b"/>
      <circle cx="0" cy="0" r="1.6" fill="#ffffff"/>
    </g>

    <!-- 灯火ピン：仙台 -->
    <g transform="translate(47, -34)">
      <circle cx="0" cy="0" r="6" fill="none" stroke="#0061a1" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="0" cy="0" r="3.2" fill="#0061a1"/>
      <circle cx="0" cy="0" r="1.2" fill="#ffffff"/>
    </g>

    <!-- 灯火ピン：東京 (キーステーション) -->
    <g transform="translate(24, 14)">
      <circle cx="0" cy="0" r="11" fill="none" stroke="#0061a1" stroke-opacity="0.25" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="7.5" fill="none" stroke="#0061a1" stroke-opacity="0.45" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4.5" fill="#0061a1"/>
      <circle cx="0" cy="0" r="1.8" fill="#ffffff"/>
    </g>

    <!-- 灯火ピン：京都・大阪 -->
    <g transform="translate(-20, 40)">
      <circle cx="0" cy="0" r="7.5" fill="none" stroke="#007ac9" stroke-opacity="0.35" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="3.8" fill="#007ac9"/>
      <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
    </g>

    <!-- 灯火ピン：福岡・九州 -->
    <g transform="translate(-80, 88)">
      <circle cx="0" cy="0" r="7.5" fill="none" stroke="#006c4b" stroke-opacity="0.3" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="3.8" fill="#006c4b"/>
      <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- ========================================================
       右側アクセント：トンボと呼応する対角の測位マーカー＆灯火
       ======================================================== -->
  <g transform="translate(1040, 200)">
    <!-- 測位クロスマーク -->
    <line x1="-36" y1="0" x2="36" y2="0" stroke="#0061a1" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="2,4"/>
    <line x1="0" y1="-36" x2="0" y2="36" stroke="#0061a1" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="2,4"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#0061a1" stroke-opacity="0.25" stroke-width="1.2"/>
    
    <!-- 右側灯火ピン -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="#006c4b" stroke-opacity="0.3" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="5" fill="#006c4b"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff"/>
  </g>

  <!-- 中央（x: 320〜880）はサイト側CSSテキスト表示用の完全余白ゾーン -->
</svg>
